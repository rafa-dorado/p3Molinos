<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molino I · El del Gigante Dormido</title>
<style>
  :root{--cielo:#c9dceb;--tierra:#b8874a;--tierra-osc:#7a5528;--molino:#f4efe4;
    --piedra:#8a8073;--trigo:#e0b64a;--verde:#6b8e4e;--tinta:#2e2013;--rojo:#a8432f;--crema:#f7f2e7;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:linear-gradient(180deg,var(--cielo),#dfe8d4 55%,var(--tierra));
    color:var(--tinta);min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:20px}
  .hud{background:rgba(46,32,19,.85);color:var(--crema);padding:10px 18px;border-radius:12px;
    margin-bottom:16px;text-align:center;letter-spacing:.5px}
  .card{background:var(--crema);border-radius:18px;padding:32px;box-shadow:0 10px 40px rgba(0,0,0,.18);
    border:1px solid rgba(122,85,40,.25)}
  .eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:.72rem;color:var(--rojo);font-family:Arial,sans-serif}
  h2{font-size:1.9rem;margin:8px 0 6px;color:var(--tierra-osc);font-weight:normal}
  .narr{font-style:italic;color:#5a4a33;line-height:1.6;margin:16px 0;padding-left:16px;border-left:3px solid var(--trigo)}
  p{line-height:1.6;margin:10px 0}
  .mini{font-size:.82rem;color:var(--piedra);font-family:Arial,sans-serif}
  .piezas{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;justify-content:center}
  .pieza{background:#fff;border:2px solid var(--tierra);border-radius:10px;padding:10px 16px;cursor:pointer;
    user-select:none;transition:.15s;font-size:.95rem}
  .pieza:hover{background:var(--trigo)}
  .pieza.sel{outline:3px solid var(--rojo)}
  .pieza.usada{opacity:.3;pointer-events:none}
  .huecos{display:flex;flex-direction:column;gap:10px;margin:16px 0}
  .hueco{border:2px dashed var(--tierra);border-radius:10px;padding:14px;min-height:52px;display:flex;
    align-items:center;gap:10px;background:#fff8ec;transition:.2s;cursor:pointer}
  .hueco.ok{border-color:var(--verde);background:#eef3e6;border-style:solid}
  .hueco .etiq{font-size:.8rem;color:var(--piedra);font-family:Arial,sans-serif;min-width:150px}
  .puesto{font-weight:bold;color:var(--tierra-osc)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:12px 24px;font-size:1rem;transition:.2s}
  .btn-main{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #7d2f20}
  .btn-main:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;color:var(--tierra-osc);border:2px solid var(--tierra)}
  .btn-ghost:hover{background:var(--tierra);color:#fff}
  .acciones{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .feedback{padding:12px 16px;border-radius:10px;margin:14px 0;font-size:.95rem;display:none}
  .feedback.show{display:block}
  .feedback.mal{background:#f6e0da;color:var(--rojo);border:1px solid var(--rojo)}
  .pista-box{background:#fff8ec;border:1px dashed var(--tierra);border-radius:10px;padding:12px;margin:12px 0;font-size:.9rem;display:none}
  .pista-box.show{display:block}
  .molino-vis{position:relative;width:120px;height:170px;margin:0 auto 10px}
  .torre{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:110px solid var(--molino)}
  .tejado{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:26px solid var(--tierra-osc)}
  .aspas{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:110px;height:110px}
  .aspas.girando{animation:girar 3s linear infinite}
  @keyframes girar{to{transform:translateX(-50%) rotate(360deg)}}
  .aspa{position:absolute;top:50%;left:50%;width:8px;height:52px;background:var(--tierra-osc);transform-origin:top center;border-radius:3px}
  .aspa:nth-child(1){transform:translate(-50%,0) rotate(0)}
  .aspa:nth-child(2){transform:translate(-50%,0) rotate(90deg)}
  .aspa:nth-child(3){transform:translate(-50%,0) rotate(180deg)}
  .aspa:nth-child(4){transform:translate(-50%,0) rotate(270deg)}
  .clave-box{text-align:center;background:var(--tierra-osc);color:var(--crema);border-radius:16px;padding:26px;margin-top:20px}
  .clave{font-size:2.6rem;letter-spacing:8px;font-weight:bold;color:var(--trigo);margin:10px 0}
  .centro{text-align:center}
  @media (prefers-reduced-motion:reduce){.aspas.girando{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">🌬️ El Secreto de los Molinos · Pantalla 1 de 5</div>
  <div class="card" id="escena"></div>
</div>
<script>
const esc=document.getElementById('escena');
const PALABRA="VIENTO";

function molinoSVG(g){return `<div class="molino-vis"><div class="torre"></div><div class="tejado"></div>
  <div class="aspas ${g?'girando':''}"><div class="aspa"></div><div class="aspa"></div><div class="aspa"></div><div class="aspa"></div></div></div>`}

function intro(){
  esc.innerHTML=`<div class="centro">${molinoSVG(false)}<span class="eyebrow">Molino I · El del Gigante Dormido</span>
    <h2>Lo que Don Quijote vio</h2></div>
    <div class="narr">"En su locura, el caballero confundió cada parte del molino con algo de un gigante.
    Une lo que él imaginó con lo que de verdad era, y despertarás la sabiduría de este molino."</div>
    <p class="mini">Toca una visión de Don Quijote y luego el recuadro con su realidad. Empareja las cuatro.</p>
    <div class="piezas" id="piezas"></div>
    <div class="huecos" id="huecos"></div>
    <div class="feedback mal" id="fb"></div>
    <div class="pista-box" id="pista">💡 Piensa en la forma: los "brazos" que se mueven en círculo son lo más visible del molino.</div>
    <div class="acciones"><button class="btn-ghost" onclick="document.getElementById('pista').classList.add('show')">Pedir pista</button></div>`;
  const pares=[
    {v:"🦾 Brazos larguísimos",r:"Las aspas del molino"},
    {v:"👁️ Ojo giratorio",r:"La rueda del engranaje"},
    {v:"🗣️ Voz que ruge",r:"El crujido de las muelas"},
    {v:"🧍 Cuerpo gigante",r:"La torre de piedra"},
  ];
  const baraj=[...pares].sort(()=>Math.random()-.5);
  document.getElementById('piezas').innerHTML=baraj.map(p=>`<div class="pieza" data-r="${p.r}">${p.v}</div>`).join('');
  document.getElementById('huecos').innerHTML=pares.map(p=>
    `<div class="hueco" data-r="${p.r}"><span class="etiq">En realidad era...</span><strong>${p.r}</strong><span class="puesto"></span></div>`).join('');
  let sel=null;
  const piezas=document.querySelectorAll('.pieza');
  const huecos=document.querySelectorAll('.hueco');
  piezas.forEach(p=>p.onclick=()=>{piezas.forEach(x=>x.classList.remove('sel'));sel=p;p.classList.add('sel')});
  huecos.forEach(h=>h.onclick=()=>{
    if(!sel)return;
    if(sel.dataset.r===h.dataset.r){
      h.classList.add('ok');h.querySelector('.puesto').textContent="✔";
      sel.classList.add('usada');sel.classList.remove('sel');sel=null;
      if([...huecos].every(x=>x.classList.contains('ok'))) setTimeout(ganar,500);
    }else{
      const fb=document.getElementById('fb');fb.classList.add('show');fb.textContent="Eso no encaja. Observa bien y prueba de nuevo.";
      setTimeout(()=>fb.classList.remove('show'),1700);
    }
  });
}
function ganar(){
  esc.innerHTML=`<div class="centro">${molinoSVG(true)}<span class="eyebrow">Molino restaurado</span>
    <h2>¡Las aspas giran de nuevo!</h2>
    <p>Has despertado el primer molino. Don Quijote te entrega la primera palabra del Pergamino del Honor.</p></div>
    <div class="clave-box"><div class="mini" style="color:var(--crema)">APUNTA ESTA PALABRA · la necesitarás en el examen final</div>
      <div class="clave">${PALABRA}</div>
      <div class="mini" style="color:var(--crema)">Palabra 1 de 4</div></div>
    <p class="centro mini" style="margin-top:16px">Cuando la tengas anotada, pasa a la Pantalla 2.</p>`;
}
intro();
</script>
</body>
</html>
